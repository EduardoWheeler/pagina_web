<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Artistas - Acceso</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="tabs">
                <button id="btn-login-tab" class="active">Iniciar Sesión</button>
                <button id="btn-register-tab">Registrarse</button>
            </div>

            <!-- Formulario de Inicio de Sesión -->
            <form id="login-form" class="form">
                <h2>Iniciar Sesión</h2>
                <div class="input-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn">Entrar</button>
                <p id="login-error" class="error-msg"></p>
            </form>

            <!-- Formulario de Registro -->
            <form id="register-form" class="form hidden">
                <h2>Registro de Artista</h2>
                <div class="input-group">
                    <label for="register-nombre">Nombre</label>
                    <input type="text" id="register-nombre" required minlength="2">
                </div>
                <div class="input-group">
                    <label for="register-email">Correo Electrónico</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="input-group">
                    <label for="register-password">Contraseña</label>
                    <input type="password" id="register-password" required minlength="8">
                    <ul class="password-requirements">
                        <li id="req-length" class="invalid">Mínimo 8 caracteres</li>
                        <li id="req-upper" class="invalid">Una letra mayúscula</li>
                        <li id="req-lower" class="invalid">Una letra minúscula</li>
                        <li id="req-number" class="invalid">Un número</li>
                    </ul>
                </div>
                <button type="submit" id="btn-register" class="btn" disabled>Registrarse</button>
                <p id="register-error" class="error-msg"></p>
                <p id="register-success" class="success-msg"></p>
            </form>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
</body>
</html>
